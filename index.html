<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>С ДР ЕМАЕ!</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
            cursor: pointer;
        }

        /* blurred, oversized copy of the same photo sitting behind #monkey —
           fills the black bars that "contain" leaves on wide screens */
        #monkeyBg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            /* blur fades to transparent right at the element's own edge, so
               the box must be scaled up far more than the blur radius itself
               (in px) or that fade shows through as translucent edges on
               narrow phone screens */
            filter: blur(28px) brightness(0.55);
            transform: scale(1.5);
            z-index: 0;
            user-select: none;
            -webkit-user-drag: none;
            pointer-events: none;
        }

        #monkey {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            /* portrait photo: default to cover for narrow/phone screens */
            object-fit: cover;
            transform: scale(1);
            transform-origin: center center;
            transition: transform 0.35s ease-out;
            z-index: 1;
            user-select: none;
            -webkit-user-drag: none;
        }

        /* on wide/landscape (PC) screens "cover" leaves only a cropped center
           strip visible, so switch to "contain" once the viewport is wider
           relative to its height than the photo itself — that keeps the whole
           photo fitted vertically, letting #monkeyBg show through the sides */
        @media (min-aspect-ratio: 750/997) {
            #monkey {
                object-fit: contain;
            }
        }

        .title {
            position: fixed;
            bottom: 10%;
            left: 50%;
            transform: translateX(-50%);
            z-index: 5;
            font-family: "Comic Sans MS", "Arial Rounded MT Bold", sans-serif;
            font-size: 12vw;
            font-weight: 900;
            text-align: center;
            white-space: nowrap;
            text-transform: uppercase;
            letter-spacing: 0.02em;

            background: linear-gradient(
                90deg,
                #ff0040, #ff8c00, #ffee00, #33ff00,
                #00e0ff, #3b6bff, #b400ff, #ff0040
            );
            background-size: 400% 100%;
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            color: transparent;

            animation: rainbow 4s linear infinite, pulse 1.4s ease-in-out infinite;
            text-shadow: 0 0 30px rgba(255, 255, 255, 0.35);
            pointer-events: none;
        }

        @keyframes rainbow {
            0% { background-position: 0% 50%; }
            100% { background-position: 400% 50%; }
        }

        @keyframes pulse {
            0%, 100% { transform: translateX(-50%) scale(1); }
            50% { transform: translateX(-50%) scale(1.08); }
        }

        /* blurred, muted, fullscreen duplicate of the rickroll clip — fills
           whatever the width-sized main video leaves empty top/bottom */
        #rickrollBg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            /* same reasoning as #monkeyBg: bigger overscale + smaller blur
               radius so the transparent fade at the edge never shows */
            filter: blur(28px) brightness(0.55);
            transform: scale(1.5);
            z-index: 99;
            display: none;
            opacity: 0;
            pointer-events: none;
        }

        /* stays invisible through most of the main video's growth, then
           fades in over its last second so it's fully visible exactly when
           the main video finishes growing */
        #rickrollBg.show {
            display: block;
            animation: bgFadeIn 1s ease-out 3s forwards;
        }

        @keyframes bgFadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        #rickroll {
            position: fixed;
            top: 50%;
            left: 50%;
            width: 10px;
            height: auto;
            z-index: 100;
            display: none;
            opacity: 0;
            /* single combined `transform` (not the separate translate/rotate
               properties) keeps this centered reliably on mobile browsers */
            transform: translate(-50%, -50%) rotate(0deg);
        }

        #rickroll.fly-in {
            display: block;
            /* linear timing = perfectly uniform growth and spin the whole 4s */
            animation: flyInGrow 4s linear forwards;
        }

        @keyframes flyInGrow {
            0% {
                opacity: 0;
                width: 10px;
                transform: translate(-50%, -50%) rotate(0deg);
            }
            2.5% {
                /* pops fully visible almost instantly (0.1s of the 4s animation) */
                opacity: 1;
            }
            100% {
                opacity: 1;
                width: 100vw;
                transform: translate(-50%, -50%) rotate(720deg);
            }
        }

        @media (max-width: 700px) {
            .title {
                font-size: 14vw;
            }
        }
    </style>
</head>
<body>
    <img id="monkeyBg" src="monkey.jpg" alt="" aria-hidden="true">
    <img id="monkey" src="monkey.jpg" alt="monkey">
    <div class="title">с др емае</div>
    <video id="rickrollBg" src="Rick_Roll_Video_Meme_Template_V1.mp4" playsinline loop muted></video>
    <video id="rickroll" src="Rick_Roll_Video_Meme_Template_V1.mp4" playsinline loop></video>

    <script>
        const monkey = document.getElementById('monkey');
        const rickroll = document.getElementById('rickroll');
        const rickrollBg = document.getElementById('rickrollBg');
        const fartSrc = 'fart-with-reverb.mp3';

        const BASE_GROWTH_PERCENT = 3; // click 1 grows the image by 3%
        const RICKROLL_CLICK = 5;

        let clicks = 0;
        let scale = 1;

        function playFart() {
            const audio = new Audio(fartSrc);
            audio.play().catch(() => {});
        }

        function growMonkey() {
            // the growth percentage doubles every click
            const growthPercent = BASE_GROWTH_PERCENT * Math.pow(2, clicks - 1);
            scale *= 1 + growthPercent / 100;
            monkey.style.transform = `scale(${scale})`;
        }

        function launchRickroll() {
            rickrollBg.classList.add('show');
            rickrollBg.currentTime = 0;
            rickrollBg.play().catch(() => {});

            rickroll.classList.add('fly-in');
            rickroll.currentTime = 0;
            rickroll.muted = false;
            rickroll.play().catch(() => {});
        }

        document.addEventListener('click', () => {
            if (rickroll.classList.contains('fly-in')) return;

            clicks++;
            playFart();
            growMonkey();

            if (clicks >= RICKROLL_CLICK) {
                launchRickroll();
            }
        });
    </script>
</body>
</html>
